name: Deploy training Preview backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/base44/setup-b8f0f68b'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled Preview function
        run: |
          mkdir -p /tmp/training-edge-tools
          npm install --prefix /tmp/training-edge-tools --no-audit --no-fund esbuild@0.25.12
          APP_NODE_MODULES=/tmp/training-edge-tools/node_modules TRAINING_EDGE_OUTPUT="$GITHUB_WORKSPACE/supabase/functions/training-preview" node training-hosted/build-edge.mjs
          test -s supabase/functions/training-preview/index.js
      - name: Provide default Supabase Edge entrypoint
        run: |
          printf 'import "./index.js";\n' > supabase/functions/training-preview/index.ts
          test -s supabase/functions/training-preview/index.ts
      - name: Deploy only training-preview to Supabase Preview
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          npx --yes supabase@2 functions deploy training-preview --project-ref jpnsxrzlthkvyphepbao --no-verify-jwt
      - name: Verify Preview health
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "https://jpnsxrzlthkvyphepbao.supabase.co/functions/v1/training-preview/health"
